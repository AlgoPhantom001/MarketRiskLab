[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketrisklab"
version = "0.1.0"
description = "Validated educational market-risk and derivatives methodology engine"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "yfinance"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
marketrisklab = "marketrisklab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
